{% extends 'Negocioapp/base.html' %}
{% load static %}

{% block title %}Crear Nuevo Producto - Cositas para las Once{% endblock %}

{% block content %}
<style>
    /* Estilos personalizados para mantener la estética pastel (Sin marrón) */
    .card-pastel {
        background-color: #FDF6EC;
        border: 1px solid rgba(232, 168, 124, 0.4);
        border-radius: 16px;
        box-shadow: 0 10px 25px rgba(232, 168, 124, 0.15);
    }

    .card-header-pastel {
        background: linear-gradient(135deg, #fcd5ce 0%, #fdf0d5 100%) !important;
        border-bottom: 1px solid rgba(232, 168, 124, 0.4);
        border-radius: 16px 16px 0 0 !important;
    }

    .text-titulo-pastel {
        color: #c95c4b;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .btn-pastel-primary {
        background-color: #c95c4b;
        color: #ffffff;
        border: none;
        border-radius: 10px;
        transition: background-color 0.2s ease;
    }

    .btn-pastel-primary:hover {
        background-color: #b04e3e;
        color: #ffffff;
    }

    .btn-pastel-light {
        background-color: #ffffff;
        color: #3d2314;
        border: 1px solid #e8a87c;
        border-radius: 10px;
        transition: all 0.2s ease;
    }

    .btn-pastel-light:hover {
        background-color: #fcd5ce;
        color: #b04e3e;
    }

    .form-control, .form-select {
        background-color: #ffffff;
        border: 1px solid rgba(232, 168, 124, 0.6);
        border-radius: 10px;
        color: #3d2314;
    }

    .form-control:focus, .form-select:focus {
        border-color: #c95c4b;
        box-shadow: 0 0 0 0.25rem rgba(201, 92, 75, 0.15);
    }
</style>

<div class="container mt-4 mb-5">
    <div class="row justify-content-center">
        <div class="col-md-9">
            <div class="card card-pastel shadow-sm">
                <div class="card-header card-header-pastel py-3 px-4">
                    <h4 class="mb-0 text-center fw-bold text-titulo-pastel">✨ Crear Nuevo Producto</h4>
                </div>
                <div class="card-body p-4 p-md-5">
                    <form id="crear-producto-form">
                        <div class="row g-3">
                            <!-- Datos Generales -->
                            <div class="col-md-6">
                                <label for="nombre" class="form-label fw-bold small text-secondary">Nombre del Producto</label>
                                <input type="text" class="form-control" id="nombre" required placeholder="Ej. Queque casero">
                            </div>

                            <!-- Categoría -->
                            <div class="col-md-6">
                                <label for="categoria" class="form-label fw-bold small text-secondary">Categoría</label>
                                <select class="form-select" id="categoria" required>
                                    <option value="" selected disabled>Seleccione una categoría...</option>
                                    <option value="alimento">ALIMENTO</option>
                                    <option value="higiene">HIGIENE</option>
                                    <option value="ropa">ROPA</option>
                                    <option value="maquillaje">MAQUILLAJE</option>
                                    <option value="adornos">ADORNOS</option>
                                    <option value="perfumes">PERFUMES</option>
                                </select>
                            </div>

                            <div class="col-12">
                                <label for="descripcion" class="form-label fw-bold small text-secondary">Descripción</label>
                                <textarea class="form-control" id="descripcion" rows="2" required placeholder="Descripción detallada del producto"></textarea>
                            </div>

                            <!-- Precios -->
                            <div class="col-md-6">
                                <label for="precio_compra" class="form-label fw-bold small text-secondary">Precio de Compra ($)</label>
                                <input type="number" step="0.01" class="form-control" id="precio_compra" required placeholder="0.00">
                            </div>

                            <div class="col-md-6">
                                <label for="precio_venta" class="form-label fw-bold small text-secondary">Precio de Venta ($)</label>
                                <input type="number" step="0.01" class="form-control" id="precio_venta" required placeholder="0.00">
                            </div>

                            <!-- Fechas y Estado -->
                            <div class="col-md-4">
                                <label for="fecha_registro" class="form-label fw-bold small text-secondary">Fecha Registro</label>
                                <input type="date" class="form-control" id="fecha_registro" required>
                            </div>

                            <div class="col-md-4">
                                <label for="fecha_caducidad" class="form-label fw-bold small text-secondary">Fecha Caducidad (Opcional)</label>
                                <input type="date" class="form-control" id="fecha_caducidad">
                            </div>

                            <div class="col-md-4">
                                <label for="estado" class="form-label fw-bold small text-secondary">Estado</label>
                                <select class="form-select" id="estado">
                                    <option value="true" selected>Activo</option>
                                    <option value="false">Inactivo</option>
                                </select>
                            </div>

                            <div class="col-12">
                                <hr class="my-3 text-muted opacity-25">
                                <h5 class="fw-bold text-titulo-pastel fs-6 mb-0">📦 Configuración de Inventario Inicial</h5>
                            </div>

                            <!-- Stock -->
                            <div class="col-md-6">
                                <label for="stock_actual" class="form-label fw-bold small text-secondary">Stock Inicial</label>
                                <input type="number" class="form-control" id="stock_actual" min="0" required placeholder="0">
                            </div>

                            <div class="col-md-6">
                                <label for="stock_minimo" class="form-label fw-bold small text-secondary">Stock Mínimo</label>
                                <input type="number" class="form-control" id="stock_minimo" min="1" required placeholder="1">
                            </div>
                        </div>

                        <!-- Alertas -->
                        <div id="alert-container" class="mt-4 d-none">
                            <div class="alert border-0 shadow-sm text-center fw-semibold py-2" id="alert-message"></div>
                        </div>

                        <!-- Botones de Acción -->
                        <div class="d-flex justify-content-between mt-4 pt-2">
                            <a href="{% url 'productos' %}" class="btn btn-pastel-light px-4 fw-bold shadow-sm">⬅️ Cancelar</a>
                            <button type="submit" class="btn btn-pastel-primary px-4 fw-bold shadow-sm">✨ Guardar Producto</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Script de consumo de API (Mantiene intacta tu lógica original) -->
<script>
    // Asignar fecha actual por defecto a fecha_registro
    document.getElementById('fecha_registro').value = new Date().toISOString().split('T')[0];

    document.getElementById('crear-producto-form').addEventListener('submit', function(e) {
        e.preventDefault();

        const token = localStorage.getItem('authToken');
        const alertContainer = document.getElementById('alert-container');
        const alertMessage = document.getElementById('alert-message');

        const payload = {
            nombre: document.getElementById('nombre').value,
            descripcion: document.getElementById('descripcion').value,
            categoria: document.getElementById('categoria').value,
            precio_compra: parseFloat(document.getElementById('precio_compra').value),
            precio_venta: parseFloat(document.getElementById('precio_venta').value),
            fecha_registro: document.getElementById('fecha_registro').value,
            fecha_caducidad: document.getElementById('fecha_caducidad').value || null,
            estado: document.getElementById('estado').value === 'true',
            stock_actual: parseInt(document.getElementById('stock_actual').value),
            stock_minimo: parseInt(document.getElementById('stock_minimo').value)
        };

        fetch('/api/producto/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': token ? `Token ${token}` : ''
            },
            body: JSON.stringify(payload)
        })
        .then(response => response.json().then(data => ({ status: response.status, body: data })))
        .then(obj => {
            alertContainer.classList.remove('d-none');
            if (obj.status === 201) {
                alertMessage.className = 'alert border-0 shadow-sm fw-semibold py-2';
                alertMessage.style.backgroundColor = '#d8f3dc';
                alertMessage.style.color = '#2d6a4f';
                alertMessage.textContent = '¡Producto ingresado con éxito!';
                setTimeout(() => {
                    window.location.href = '/producto/';
                }, 1500);
            } else {
                alertMessage.className = 'alert border-0 shadow-sm fw-semibold py-2';
                alertMessage.style.backgroundColor = '#fcd5ce';
                alertMessage.style.color = '#c95c4b';
                alertMessage.textContent = obj.body.error || obj.body.mensaje || 'Error al guardar el producto.';
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alertContainer.classList.remove('d-none');
            alertMessage.className = 'alert border-0 shadow-sm fw-semibold py-2';
            alertMessage.style.backgroundColor = '#fcd5ce';
            alertMessage.style.color = '#c95c4b';
            alertMessage.textContent = 'Error de conexión con el servidor.';
        });
    });
</script>
{% endblock %}
