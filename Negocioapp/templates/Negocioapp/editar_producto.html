{% extends 'Negocioapp/base.html' %}
{% load static %}

{% block title %}Editar Producto - Cositas para las Once{% endblock %}

{% block content %}
<style>
    /* Estilos personalizados para mantener la estética pastel (Sin marrón) */
    .card-pastel {
        background-color: #FDF6EC;
        border: 1px solid rgba(232, 168, 124, 0.4);
        border-radius: 16px;
        box-shadow: 0 10px 25px rgba(232, 168, 124, 0.15);
    }

    .card-header-pastel {
        background: linear-gradient(135deg, #fcd5ce 0%, #fdf0d5 100%) !important;
        border-bottom: 1px solid rgba(232, 168, 124, 0.4);
        border-radius: 16px 16px 0 0 !important;
    }

    .text-titulo-pastel {
        color: #c95c4b;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .btn-pastel-primary {
        background-color: #c95c4b;
        color: #ffffff;
        border: none;
        border-radius: 10px;
        transition: background-color 0.2s ease;
    }

    .btn-pastel-primary:hover {
        background-color: #b04e3e;
        color: #ffffff;
    }

    .btn-pastel-light {
        background-color: #ffffff;
        color: #3d2314;
        border: 1px solid #e8a87c;
        border-radius: 10px;
        transition: all 0.2s ease;
    }

    .btn-pastel-light:hover {
        background-color: #fcd5ce;
        color: #b04e3e;
    }

    .form-control, .form-select {
        background-color: #ffffff;
        border: 1px solid rgba(232, 168, 124, 0.6);
        border-radius: 10px;
        color: #3d2314;
    }

    .form-control:focus, .form-select:focus {
        border-color: #c95c4b;
        box-shadow: 0 0 0 0.25rem rgba(201, 92, 75, 0.15);
    }
</style>

<div class="container mt-4 mb-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card card-pastel shadow-sm">
                <div class="card-header card-header-pastel py-3 px-4">
                    <h4 class="mb-0 text-center fw-bold text-titulo-pastel">✨ Editar Producto</h4>
                </div>
                <div class="card-body p-4 p-md-5">
                    <form id="editar-producto-form">
                        <div class="row g-3">
                            <!-- Datos Generales -->
                            <div class="col-md-6">
                                <label for="nombre" class="form-label fw-bold small text-secondary">Nombre del Producto</label>
                                <input type="text" class="form-control" id="nombre" required>
                            </div>

                            <div class="col-md-6">
                                <label for="categoria" class="form-label fw-bold small text-secondary">Categoría</label>
                                <input type="text" class="form-control" id="categoria" required>
                            </div>

                            <div class="col-12">
                                <label for="descripcion" class="form-label fw-bold small text-secondary">Descripción</label>
                                <textarea class="form-control" id="descripcion" rows="2" required></textarea>
                            </div>

                            <!-- Precios -->
                            <div class="col-md-6">
                                <label for="precio_compra" class="form-label fw-bold small text-secondary">Precio de Compra ($)</label>
                                <input type="number" step="0.01" class="form-control" id="precio_compra" required>
                            </div>

                            <div class="col-md-6">
                                <label for="precio_venta" class="form-label fw-bold small text-secondary">Precio de Venta ($)</label>
                                <input type="number" step="0.01" class="form-control" id="precio_venta" required>
                            </div>

                            <!-- Fechas y Estado -->
                            <div class="col-md-4">
                                <label for="fecha_registro" class="form-label fw-bold small text-secondary">Fecha Registro</label>
                                <input type="date" class="form-control" id="fecha_registro" required>
                            </div>

                            <div class="col-md-4">
                                <label for="fecha_caducidad" class="form-label fw-bold small text-secondary">Fecha Caducidad (Opcional)</label>
                                <input type="date" class="form-control" id="fecha_caducidad">
                            </div>

                            <div class="col-md-4">
                                <label for="estado" class="form-label fw-bold small text-secondary">Estado</label>
                                <select class="form-select" id="estado">
                                    <option value="true">Activo</option>
                                    <option value="false">Inactivo</option>
                                </select>
                            </div>
                        </div>

                        <!-- Alertas -->
                        <div id="alert-container" class="mt-4 d-none">
                            <div class="alert border-0 shadow-sm text-center fw-semibold py-2" id="alert-message"></div>
                        </div>

                        <!-- Botones de Acción -->
                        <div class="d-flex justify-content-between mt-4 pt-2">
                            <a href="{% url 'productos' %}" class="btn btn-pastel-light px-4 fw-bold shadow-sm">⬅️ Cancelar</a>
                            <button type="submit" class="btn btn-pastel-primary px-4 fw-bold shadow-sm">✨ Guardar Cambios</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Script para cargar y actualizar datos mediante la API (Mantiene intacta tu lógica original) -->
<script>
    const productoId = "{{ producto_id }}";
    const token = localStorage.getItem('authToken');

    // 1. Cargar los datos actuales del producto al abrir la vista
    fetch(`/api/producto/${productoId}/`, {
        method: 'GET',
        headers: {
            'Authorization': token ? `Token ${token}` : ''
        }
    })
    .then(response => response.json())
    .then(data => {
        if (data.id) {
            document.getElementById('nombre').value = data.nombre;
            document.getElementById('categoria').value = data.categoria;
            document.getElementById('descripcion').value = data.descripcion;
            document.getElementById('precio_compra').value = data.precio_compra;
            document.getElementById('precio_venta').value = data.precio_venta;
            document.getElementById('fecha_registro').value = data.fecha_registro;
            document.getElementById('fecha_caducidad').value = data.fecha_caducidad || '';
            document.getElementById('estado').value = data.estado ? 'true' : 'false';
        } else {
            alert('No se pudo cargar la información del producto.');
        }
    })
    .catch(error => {
        console.error('Error de conexión:', error);
    });

    // 2. Enviar los cambios actualizados mediante PUT
    document.getElementById('editar-producto-form').addEventListener('submit', function(e) {
        e.preventDefault();

        const alertContainer = document.getElementById('alert-container');
        const alertMessage = document.getElementById('alert-message');

        const payload = {
            nombre: document.getElementById('nombre').value,
            descripcion: document.getElementById('descripcion').value,
            categoria: document.getElementById('categoria').value,
            precio_compra: parseFloat(document.getElementById('precio_compra').value),
            precio_venta: parseFloat(document.getElementById('precio_venta').value),
            fecha_registro: document.getElementById('fecha_registro').value,
            fecha_caducidad: document.getElementById('fecha_caducidad').value || null,
            estado: document.getElementById('estado').value === 'true'
        };

        fetch(`/api/producto/${productoId}/`, {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': token ? `Token ${token}` : ''
            },
            body: JSON.stringify(payload)
        })
        .then(response => response.json().then(data => ({ status: response.status, body: data })))
        .then(obj => {
            alertContainer.classList.remove('d-none');
            if (obj.status === 200) {
                alertMessage.className = 'alert border-0 shadow-sm fw-semibold py-2';
                alertMessage.style.backgroundColor = '#d8f3dc';
                alertMessage.style.color = '#2d6a4f';
                alertMessage.textContent = '¡Producto actualizado con éxito!';
                setTimeout(() => {
                    window.location.href = '/producto/';
                }, 1500);
            } else {
                alertMessage.className = 'alert border-0 shadow-sm fw-semibold py-2';
                alertMessage.style.backgroundColor = '#fcd5ce';
                alertMessage.style.color = '#c95c4b';
                alertMessage.textContent = obj.body.error || obj.body.mensaje || 'Error al actualizar el producto.';
            }
        })
        .catch(error => {
            console.error('Error de conexión:', error);
            alertContainer.classList.remove('d-none');
            alertMessage.className = 'alert border-0 shadow-sm fw-semibold py-2';
            alertMessage.style.backgroundColor = '#fcd5ce';
            alertMessage.style.color = '#c95c4b';
            alertMessage.textContent = 'Error de conexión con el servidor.';
        });
    });
</script>
{% endblock %}
